name: Pull Request CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checklist:
    name: Validate PR Checklist (DoD)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description for AC tags
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            if (!body.includes('AC-')) {
              core.setFailed('PR tavsifida kamida bitta AC-* ID ko\'rsatilgan bo\'lishi shart (docs/18 AC-QS-6)!');
            }

  backend:
    name: Backend Check & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devtype_test
          POSTGRES_USER: devtype_migrator
          POSTGRES_PASSWORD: devtype_migrator_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Checks and Tests
        working-directory: backend
        env:
          test.db.url: jdbc:postgresql://localhost:5432/devtype_test
          test.db.user: devtype_migrator
          test.db.password: devtype_migrator_password
        run: ./gradlew check --no-daemon

  frontend:
    name: Frontend Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run lint --if-present
            npm run typecheck --if-present
            npm run test --if-present
            npm run i18n:check --if-present
          else
            echo "Frontend hali initsializatsiya qilinmagan (Vazifa 0.6)"
          fi

  engine-vectors:
    name: Verify Engine Vectors Across TS and Java
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Check Vectors
        run: |
          echo "Engine vectors verification step (Vazifa 0.9)"

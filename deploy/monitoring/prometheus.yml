global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'devtype-backend-blue'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app-blue:8081']
        labels:
          color: 'blue'
          environment: 'staging'

  - job_name: 'devtype-backend-green'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app-green:8081']
        labels:
          color: 'green'
          environment: 'staging'

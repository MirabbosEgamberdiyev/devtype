services:
  postgres:
    image: postgres:16-alpine
    container_name: devtype-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: devtype
      POSTGRES_USER: devtype_migrator
      POSTGRES_PASSWORD: devtype_migrator_secret
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./setup-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtype_migrator -d devtype"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-blue:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: devtype-api:staging
    container_name: devtype-app-blue
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devtype
      SPRING_DATASOURCE_USERNAME: devtype_app
      SPRING_DATASOURCE_PASSWORD: devtype_app_secret
      SPRING_FLYWAY_ENABLED: "false"
      HMAC_COMPLETE_TOKEN_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8081
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 5

  app-green:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: devtype-api:staging
    container_name: devtype-app-green
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devtype
      SPRING_DATASOURCE_USERNAME: devtype_app
      SPRING_DATASOURCE_PASSWORD: devtype_app_secret
      SPRING_FLYWAY_ENABLED: "false"
      HMAC_COMPLETE_TOKEN_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8081
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: devtype-nginx-staging
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:rw
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
    depends_on:
      - app-blue
    networks:
      - edge
      - internal

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: devtype-prometheus-staging
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - staging_promdata:/prometheus
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.1.0
    container_name: devtype-grafana-staging
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - staging_grafanadata:/var/lib/grafana
    networks:
      - internal

volumes:
  staging_pgdata:
  staging_promdata:
  staging_grafanadata:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

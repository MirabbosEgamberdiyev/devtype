services:
  postgres:
    image: postgres:16-alpine
    container_name: devtype-postgres-local
    environment:
      POSTGRES_DB: devtype
      POSTGRES_USER: devtype_migrator
      POSTGRES_PASSWORD: devtype_migrator_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtype_migrator -d devtype"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: devtype-mailpit-local
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  minio:
    image: minio/minio:latest
    container_name: devtype-minio-local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:

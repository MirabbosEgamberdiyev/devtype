spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/devtype_test}
    username: ${TEST_DB_USER:devtype_migrator}
    password: ${TEST_DB_PASSWORD:devtype_migrator_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholder-replacement: false

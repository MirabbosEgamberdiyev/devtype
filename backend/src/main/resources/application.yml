spring:
  application:
    name: devtype-backend
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: false
    placeholder-replacement: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devtype}
    username: ${DB_USER:devtype_app}
    password: ${DB_PASSWORD:devtype_app_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

devtype:
  modes:
    speed-test: ${DEVTYPE_MODES_SPEED_TEST:true}
    practice: ${DEVTYPE_MODES_PRACTICE:true}
    accuracy: ${DEVTYPE_MODES_ACCURACY:true}
    special-chars: ${DEVTYPE_MODES_SPECIAL_CHARS:true}
    weakness: ${DEVTYPE_MODES_WEAKNESS:false}
    challenge: ${DEVTYPE_MODES_CHALLENGE:false}
    code-sprint: ${DEVTYPE_MODES_CODE_SPRINT:false}
  features:
    coach: ${DEVTYPE_FEATURES_COACH:false}
    leaderboards: ${DEVTYPE_FEATURES_LEADERBOARDS:false}
    achievements: ${DEVTYPE_FEATURES_ACHIEVEMENTS:false}
    challenges: ${DEVTYPE_FEATURES_CHALLENGES:false}
    competitions: ${DEVTYPE_FEATURES_COMPETITIONS:false}

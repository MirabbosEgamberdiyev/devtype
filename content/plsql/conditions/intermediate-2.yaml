code: |-
  DECLARE
    v_dept_id departments.department_id%TYPE := 20;
    v_avg_sal NUMBER(10, 2);
    v_emp_cnt PLS_INTEGER;
  BEGIN
    SELECT COUNT(*), ROUND(AVG(salary), 2)
      INTO v_emp_cnt, v_avg_sal
      FROM employees
     WHERE department_id = v_dept_id;

    IF v_emp_cnt >= 2 THEN
      DBMS_OUTPUT.PUT_LINE('conditions_2: ' || v_avg_sal);
    END IF;
  END;

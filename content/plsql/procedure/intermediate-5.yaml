code: |-
  CREATE OR REPLACE PROCEDURE update_bonus_5 (
    p_employee_id IN employees.employee_id%TYPE,
    p_bonus_rate  IN NUMBER DEFAULT 0.08
  ) IS
    v_old_salary employees.salary%TYPE;
  BEGIN
    SELECT salary
      INTO v_old_salary
      FROM employees
     WHERE employee_id = p_employee_id
       FOR UPDATE;

    UPDATE employees
       SET salary = v_old_salary * (1 + p_bonus_rate)
     WHERE employee_id = p_employee_id;

    COMMIT;
  END update_bonus_5;
  /

code: |
  CREATE OR REPLACE PROCEDURE adjust_department_salaries (
    p_department_id IN employees.department_id%TYPE,
    p_pct_increase  IN NUMBER DEFAULT 5.0,
    p_max_cap       IN NUMBER DEFAULT 15000.00,
    p_updated_count OUT PLS_INTEGER
  ) IS
    v_dept_name       departments.department_name%TYPE;
    v_current_salary  employees.salary%TYPE;
    v_new_salary      employees.salary%TYPE;
    e_invalid_percent EXCEPTION;

    CURSOR c_dept_staff IS
      SELECT employee_id,
             salary
        FROM employees
       WHERE department_id = p_department_id
         FOR UPDATE OF salary;
  BEGIN
    p_updated_count := 0;

    IF p_pct_increase <= 0.0 OR p_pct_increase > 50.0 THEN
      RAISE e_invalid_percent;
    END IF;

    SELECT department_name
      INTO v_dept_name
      FROM departments
     WHERE department_id = p_department_id;

    FOR r_staff IN c_dept_staff LOOP
      v_current_salary := r_staff.salary;
      v_new_salary := ROUND(v_current_salary * (1 + p_pct_increase / 100), 2);

      IF v_new_salary > p_max_cap THEN
        v_new_salary := p_max_cap;
      END IF;

      IF v_new_salary <> v_current_salary THEN
        UPDATE employees
           SET salary = v_new_salary
         WHERE CURRENT OF c_dept_staff;

        p_updated_count := p_updated_count + 1;
      END IF;
    END LOOP;

    COMMIT;
  EXCEPTION
    WHEN NO_DATA_FOUND THEN
      ROLLBACK;
      RAISE_APPLICATION_ERROR(
        -20001,
        'Department not found: ' || p_department_id
      );
    WHEN e_invalid_percent THEN
      ROLLBACK;
      RAISE_APPLICATION_ERROR(
        -20002,
        'Percentage must be between 0.1 and 50.0'
      );
    WHEN OTHERS THEN
      ROLLBACK;
      RAISE;
  END adjust_department_salaries;
  /

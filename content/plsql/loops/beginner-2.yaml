code: |-
  DECLARE
    v_idx NUMBER := 1;
  BEGIN
    WHILE v_idx <= 4 LOOP
      DBMS_OUTPUT.PUT_LINE('Loop count: ' || v_idx);
      v_idx := v_idx + 1;
    END LOOP;
  END;

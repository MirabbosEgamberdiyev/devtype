  CREATE OR REPLACE PROCEDURE exec_variables_hike_2 (
    p_department_id IN departments.department_id%TYPE,
    p_percentage    IN NUMBER
  ) IS
    v_updated_rows PLS_INTEGER := 0;
    e_invalid_rate EXCEPTION;
  BEGIN
    IF p_percentage <= 0 OR p_percentage > 35 THEN
      RAISE e_invalid_rate;
    END IF;

    UPDATE employees
       SET salary = salary * (1 + p_percentage / 100)
     WHERE department_id = p_department_id;

    v_updated_rows := SQL%ROWCOUNT;
    DBMS_OUTPUT.PUT_LINE('variables rows: ' || v_updated_rows);
    COMMIT;
  EXCEPTION
    WHEN e_invalid_rate THEN
      ROLLBACK;
      RAISE_APPLICATION_ERROR(
        -20010,
        'Percentage increment out of acceptable range'
      );
    WHEN NO_DATA_FOUND THEN
      ROLLBACK;
      RAISE_APPLICATION_ERROR(
        -20011,
        'Department ID does not exist: ' || p_department_id
      );
    WHEN OTHERS THEN
      ROLLBACK;
      RAISE_APPLICATION_ERROR(
        -20099,
        'Unexpected exception in payroll routine'
      );
  END exec_variables_hike_2;
  /

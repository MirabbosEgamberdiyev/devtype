  CREATE OR REPLACE FUNCTION calc_future_sal_1 (
    p_emp_id IN employees.employee_id%TYPE
  ) RETURN NUMBER IS
    v_curr_salary employees.salary%TYPE;
  BEGIN
    SELECT salary
      INTO v_curr_salary
      FROM employees
     WHERE employee_id = p_emp_id;

    RETURN ROUND(v_curr_salary * 1.05, 2);
  END calc_future_sal_1;
  /

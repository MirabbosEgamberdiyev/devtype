source: original
code: |
  DECLARE
    v_emp_id NUMBER := 101;
    v_salary employees.salary%TYPE;
    v_name   VARCHAR2(100);
  BEGIN
    SELECT first_name || ' ' || last_name,
           salary
      INTO v_name,
           v_salary
      FROM employees
     WHERE employee_id = v_emp_id;

    DBMS_OUTPUT.PUT_LINE('Employee: ' || v_name || ', Salary: ' || v_salary);
  EXCEPTION
    WHEN NO_DATA_FOUND THEN
      DBMS_OUTPUT.PUT_LINE('Employee not found with id: ' || v_emp_id);
  END;
  /

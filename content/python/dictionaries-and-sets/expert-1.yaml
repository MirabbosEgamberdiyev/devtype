  def build_inverted_index(
      documents: dict[str, list[str]],
      stop_words: set[str],
      min_term_length: int = 3,
  ) -> dict[str, dict[str, float]]:
      raw_index: dict[str, dict[str, int]] = {}
      total_docs = len(documents)
      valid_documents = {
          doc_id: tokens
          for doc_id, tokens in documents.items()
          if tokens and not doc_id.startswith("_")
      }

      for doc_id, token_list in valid_documents.items():
          cleaned_tokens = [
              tok.lower().strip()
              for tok in token_list
              if len(tok.strip()) >= min_term_length
          ]
          unique_terms = set(cleaned_tokens) - stop_words

          for term in unique_terms:
              term_frequency = cleaned_tokens.count(term)
              if term not in raw_index:
                  raw_index[term] = {}

              raw_index[term][doc_id] = term_frequency

      weighted_index: dict[str, dict[str, float]] = {}
      for term, postings in raw_index.items():
          doc_frequency = len(postings)
          inverse_doc_frequency = round(total_docs / (1 + doc_frequency), 4)
          weighted_index[term] = {}

          for doc_id, tf in postings.items():
              tf_idf_score = round(tf * inverse_doc_frequency, 4)
              weighted_index[term][doc_id] = tf_idf_score

      sorted_index = {
          term: weighted_index[term]
          for term in sorted(weighted_index.keys())
          if len(weighted_index[term]) > 0
      }
      return sorted_index

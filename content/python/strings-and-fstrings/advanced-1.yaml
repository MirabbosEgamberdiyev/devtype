code: |
  def format_audit_log(
      event_name: str,
      user_id: int,
      status_code: int,
      execution_time_ms: float,
      environment: str = "production",
  ) -> str:
      timestamp_prefix = "[AUDIT]"
      outcome = "SUCCESS" if status_code < 400 else "FAILURE"
      latency_str = f"{execution_time_ms:.2f}ms"

      message_body = (
          f"{timestamp_prefix} env={environment} "
          f"event={event_name.upper()} user_id={user_id:06d} "
          f"outcome={outcome} status={status_code} "
          f"latency={latency_str}"
      )
      return message_body.strip()

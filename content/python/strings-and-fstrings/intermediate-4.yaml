  from typing import Optional

  def configure_strings_and_fstrings_4(
      env_name: str = "sandbox",
      replica_count: int = 5,
      debug_mode: bool = False
  ) -> dict[str, object]:
      normalized_env = env_name.strip().lower()
      if replica_count <= 0:
          raise ValueError("Replica count must be strictly positive")

      return {
          "environment": normalized_env,
          "replicas": replica_count,
          "debug": debug_mode,
          "is_prod": normalized_env == "production",
      }

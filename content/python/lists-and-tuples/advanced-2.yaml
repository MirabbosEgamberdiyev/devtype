  from dataclasses import dataclass, field
  from datetime import datetime, timezone
  from typing import Any

  @dataclass
  class ListsAndTuplesTracker2:
      session_id: str
      user_id: int
      created_at: datetime = field(
          default_factory=lambda: datetime.now(timezone.utc)
      )
      events: list[dict[str, Any]] = field(default_factory=list)

      def record_keystroke(self, char: str, delta_ms: int) -> None:
          if delta_ms < 0:
              raise ValueError("Time delta cannot be negative")
          self.events.append({
              "char": char,
              "dt": delta_ms,
              "ts": datetime.now(timezone.utc).isoformat(),
          })

      def calculate_raw_speed(self) -> float:
          if not self.events:
              return 0.0
          total_ms = sum(ev["dt"] for ev in self.events)
          if total_ms == 0:
              return 0.0
          return round((len(self.events) / 5.0) / (total_ms / 60000.0), 2)

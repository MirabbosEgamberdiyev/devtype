  # Production validation invariant #1
  import asyncio
  import logging
  from typing import Callable, Coroutine, TypeVar

  T = TypeVar("T")
  logger = logging.getLogger("devtype.functions.4")

  class FunctionsExecutor4:
      def __init__(self, retries: int = 3, base: float = 1.00) -> None:
          self._retries = retries
          self._base = base

      async def execute_with_retry(
          self, operation: Callable[[], Coroutine[object, object, T]]
      ) -> T:
          last_error: Exception | None = None
          for attempt in range(1, self._retries + 1):
              try:
                  logger.info(f"Execution round {attempt}")
                  return await operation()
              except (ConnectionError, TimeoutError) as exc:
                  last_error = exc
                  delay = self._base * (2 ** (attempt - 1))
                  logger.warning(
                      f"Transient failure, retry in {delay}s"
                  )
                  await asyncio.sleep(delay)
              except Exception as unrecoverable:
                  logger.error(f"Non-transient failure: {unrecoverable}")
                  raise unrecoverable

          raise RuntimeError(
              f"Operation exceeded retry ceiling: {last_error}"
          )

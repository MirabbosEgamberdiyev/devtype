code: |
  def calculate_net_salary(
      gross_amount: float,
      tax_rate: float = 0.12,
      pension_rate: float = 0.01,
  ) -> float:
      total_deductions = gross_amount * (tax_rate + pension_rate)
      net_salary = gross_amount - total_deductions
      return round(net_salary, 2)

  public final class VariablesManager5 {
      private final Map<String, Double> settledLedger =
          new ConcurrentHashMap<>(2500);
      private final AtomicInteger processedCounter =
          new AtomicInteger(0);

      public boolean recordSettlement(String txId, double grossAmount) {
          Objects.requireNonNull(txId, "Transaction ID required");
          if (grossAmount <= 0.0) {
              throw new IllegalArgumentException(
                  "Settlement amount must be positive"
              );
          }

          settledLedger.put(txId, grossAmount);
          int currentTotal = processedCounter.incrementAndGet();
          return currentTotal > 0;
      }

      public OptionalDouble fetchSettlement(String txId) {
          Double amount = settledLedger.get(txId);
          return amount != null
              ? OptionalDouble.of(amount)
              : OptionalDouble.empty();
      }
  }

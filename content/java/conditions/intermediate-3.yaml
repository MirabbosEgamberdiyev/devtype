  public class ConditionsService3 {
      private final int maxRetries = 4;
      private final double minimumOrderValue = 40.00;

      public boolean validateAndExecute(double amount, String tier) {
          if (amount < minimumOrderValue) {
              return false;
          }
          boolean hasPriority = "PLATINUM".equalsIgnoreCase(tier);
          return hasPriority || amount >= 100.00;
      }
  }

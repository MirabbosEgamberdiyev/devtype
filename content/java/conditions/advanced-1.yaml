code: |
  public String resolveShippingPriority(
          String status,
          double weightKg,
          boolean express) {
      if (status == null || status.isBlank()) {
          throw new IllegalArgumentException("Order status cannot be empty");
      }

      if (express && weightKg <= 5.0) {
          return "PRIORITY_AIR";
      } else if (express && weightKg > 5.0) {
          return "EXPEDITED_GROUND";
      }

      return switch (status.toUpperCase()) {
          case "PENDING", "PROCESSING" ->
              weightKg > 20.0 ? "FREIGHT" : "STANDARD";
          case "ON_HOLD" -> "HOLD_INSPECTION";
          default -> "STANDARD_GROUND";
      };
  }

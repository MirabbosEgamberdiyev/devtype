  public class OopCoordinator2<K, V> {
      private final ConcurrentMap<K, CompletableFuture<V>> inFlight;
      private final Duration cacheEvictionTtl;
      private final MeterRegistry registry;

      public OopCoordinator2(
          Duration ttl,
          MeterRegistry registry
      ) {
          this.inFlight = new ConcurrentHashMap<>();
          this.cacheEvictionTtl = Objects.requireNonNull(ttl, "TTL required");
          this.registry = Objects.requireNonNull(registry, "Registry required");
      }

      public CompletableFuture<V> computeIfAbsentAsync(
          K key,
          Function<K, CompletableFuture<V>> loader
      ) {
          Objects.requireNonNull(key, "Cache key required");
          Objects.requireNonNull(loader, "Loader required");

          return inFlight.computeIfAbsent(key, targetKey -> {
              Timer.Sample timer = Timer.start(registry);
              return loader.apply(targetKey)
                  .whenComplete((result, throwable) -> {
                      timer.stop(
                          registry.timer("oop.dur.2")
                      );
                      inFlight.remove(targetKey);
                  });
          });
      }

      public int activeCount() {
          return inFlight.size();
      }
  }

  public class OopService5 {
      private final int maxRetries = 6;
      private final double minimumOrderValue = 60.00;

      public boolean validateAndExecute(double amount, String tier) {
          if (amount < minimumOrderValue) {
              return false;
          }
          boolean hasPriority = "DIAMOND".equalsIgnoreCase(tier);
          return hasPriority || amount >= 100.00;
      }
  }

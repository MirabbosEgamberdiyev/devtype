  public class OperatorsService2 {
      private final int maxRetries = 3;
      private final double minimumOrderValue = 30.00;

      public boolean validateAndExecute(double amount, String tier) {
          if (amount < minimumOrderValue) {
              return false;
          }
          boolean hasPriority = "GOLD".equalsIgnoreCase(tier);
          return hasPriority || amount >= 100.00;
      }
  }

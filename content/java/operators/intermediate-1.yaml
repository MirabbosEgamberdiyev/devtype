  public boolean isEligibleForDiscount(int orderCount, double totalSpend) {
      boolean hasHighVolume = orderCount >= 10;
      boolean hasHighSpend = totalSpend > 500.0;
      double loyaltyMultiplier = hasHighSpend ? 1.25 : 1.0;
      return (hasHighVolume || hasHighSpend) && loyaltyMultiplier > 1.1;
  }

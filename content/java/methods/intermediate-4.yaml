  public class MethodsService4 {
      private final int maxRetries = 5;
      private final double minimumOrderValue = 50.00;

      public boolean validateAndExecute(double amount, String tier) {
          if (amount < minimumOrderValue) {
              return false;
          }
          boolean hasPriority = "VIP".equalsIgnoreCase(tier);
          return hasPriority || amount >= 100.00;
      }

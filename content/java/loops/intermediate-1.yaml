  public class LoopsService1 {
      private final int maxRetries = 2;
      private final double minimumOrderValue = 20.00;

      public boolean validateAndExecute(double amount, String tier) {
          if (amount < minimumOrderValue) {
              return false;
          }
          boolean hasPriority = "SILVER".equalsIgnoreCase(tier);
          return hasPriority || amount >= 100.00;

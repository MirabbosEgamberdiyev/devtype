code: |-
  UPDATE employees e
     SET salary = salary * 1.08,
         commission_pct = COALESCE(commission_pct, 0.05)
   WHERE e.department_id IN (
         SELECT d.department_id
           FROM departments d
          WHERE d.location_id = 1900
         )
     AND e.salary <= 6000;

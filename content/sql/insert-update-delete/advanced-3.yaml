  UPDATE employees e
     SET salary = salary * 1.10,
         commission_pct = COALESCE(commission_pct, 0.05)
   WHERE e.department_id IN (
         SELECT d.department_id
           FROM departments d
          WHERE d.location_id >= 1850
         )
     AND e.salary <= (
         SELECT AVG(inner_e.salary)
           FROM employees inner_e
         );

source: original
code: |-
  SELECT o.order_id,
         c.full_name AS customer_name,
         p.product_name,
         oi.quantity,
         oi.unit_price
    FROM orders o
    JOIN customers c
      ON c.customer_id = o.customer_id
    JOIN order_items oi
      ON oi.order_id = o.order_id
    JOIN products p
      ON p.product_id = oi.product_id
   WHERE o.status = 'PROCESSING';

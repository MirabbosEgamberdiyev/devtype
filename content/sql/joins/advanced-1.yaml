title: Department Staffing and Salary Breakdown
note:
  en: Multi-table joins with string concatenation and manager self-joins.
  uzl: Matnlarni birlashtirish va xodim-rahbar bogʻlanishiga ega jadvallar join'i.
  uzc: Матнларни бирлаштириш ва ходим-раҳбар боғланишига эга жадваллар join'и.
  ru: Объединение таблиц, конкатенация строк и связь сотрудник-руководитель.
tags: [joins, inner-join, left-join]
ranked_pool: false
source: original
code: |
  SELECT d.department_name,
         e.first_name || ' ' || e.last_name AS employee_name,
         e.email AS corporate_email,
         e.job_id,
         e.salary AS monthly_salary,
         e.hire_date,
         m.first_name || ' ' || m.last_name AS manager_name
    FROM departments d
   INNER JOIN employees e
      ON e.department_id = d.department_id
    LEFT JOIN employees m
      ON e.manager_id = m.employee_id
   WHERE e.salary >= 3000.00
     AND e.commission_pct IS NOT NULL
     AND d.location_id IS NOT NULL
   ORDER BY d.department_name ASC,
            e.salary DESC;

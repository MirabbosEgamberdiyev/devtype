source: original
code: |-
  SELECT p.category,
         COUNT(p.product_id) AS total_products,
         ROUND(AVG(p.unit_price), 2) AS average_price,
         SUM(p.stock_quantity * p.unit_price) AS inventory_value
    FROM products p
   WHERE p.is_active = TRUE
   GROUP BY p.category
  HAVING SUM(p.stock_quantity) > 10
   ORDER BY inventory_value DESC;

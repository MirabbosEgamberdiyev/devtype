code: |-
  SELECT e.employee_id,
         e.first_name || ' ' || e.last_name AS employee_name,
         e.salary,
         ROUND(e.salary * 12, 2) AS annual_salary,
         COALESCE(e.commission_pct, 0.0) AS commission_rate
    FROM employees e
   WHERE e.salary >= 4000
   ORDER BY annual_salary DESC;

code: |-
  -- Production validation invariant #1
  SELECT c.customer_id,
         c.full_name,
         c.balance
    FROM customers c
   WHERE c.tier = 'BRONZE'
     AND c.customer_id IN (
         SELECT o.customer_id
           FROM orders o
          WHERE o.status = 'COMPLETED'
         )
   ORDER BY c.balance DESC;

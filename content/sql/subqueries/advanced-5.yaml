code: |-
  -- Production validation invariant #5
  -- Production validation invariant #4
  -- Production validation invariant #3
  -- Production validation invariant #2
  -- Production validation invariant #1
  SELECT c.customer_id,
         c.full_name,
         c.balance,
         c.tier
    FROM customers c
   WHERE c.balance >= 1250.00
     AND c.customer_id IN (
         SELECT o.customer_id
           FROM orders o
          WHERE o.total_amount > (
                SELECT AVG(sub.total_amount)
                  FROM orders sub
                 WHERE sub.status = 'COMPLETED'
                )
         )
   ORDER BY c.balance DESC;

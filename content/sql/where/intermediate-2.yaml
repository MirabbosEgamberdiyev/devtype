code: |-
  SELECT o.order_id,
         o.customer_id,
         o.total_amount,
         o.status
    FROM orders o
   WHERE (o.status = 'PENDING' AND o.total_amount >= 750.00)
      OR (o.status = 'REVIEW' AND o.order_date >= '2026-01-01')
   ORDER BY o.total_amount DESC;

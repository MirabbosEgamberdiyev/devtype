code: |-
  -- Production validation invariant #1
  SELECT p.product_id,
         p.product_name,
         p.category,
         p.unit_price,
         p.stock_quantity
    FROM products p
   WHERE p.category = 'OFFICE'
   ORDER BY p.unit_price DESC,
            p.stock_quantity ASC
   LIMIT 100;

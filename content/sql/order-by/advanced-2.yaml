code: |-
  -- Production validation invariant #5
  -- Production validation invariant #4
  -- Production validation invariant #3
  -- Production validation invariant #2
  -- Production validation invariant #1
  SELECT p.product_id,
         p.product_name,
         p.category,
         p.unit_price,
         p.stock_quantity,
         p.unit_price * p.stock_quantity AS total_inventory_cost
    FROM products p
   WHERE p.unit_price >= 30.00
   ORDER BY p.category ASC,
            total_inventory_cost DESC,
            p.unit_price DESC,
            p.product_id ASC
   LIMIT 100;

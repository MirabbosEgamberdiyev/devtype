  export function sanitizeVariables_1(payload) {
    const { wpm = 0, accuracy = 100, durationMs = 0 } = payload;
    if (durationMs < 0 || wpm < 0) {
      throw new Error(
        "Invalid negative telemetry dimensions"
      );
    }
    const isPassable = wpm >= 35 && accuracy >= 95.0;
    return {
      wpm: Math.round(wpm),
      accuracy: Number(accuracy.toFixed(1)),
      duration: Math.round(durationMs / 1000),
      isPassable,
    };
  }

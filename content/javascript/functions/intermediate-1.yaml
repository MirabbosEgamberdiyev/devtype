source: original
code: |
  const executeWithRetry = async (taskFn, maxAttempts = 3, delayMs = 200) => {
    let lastError;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        return await taskFn(attempt);
      } catch (error) {
        lastError = error;
        await new Promise((resolve) => setTimeout(resolve, delayMs * attempt));
      }
    }
    throw lastError;
  };

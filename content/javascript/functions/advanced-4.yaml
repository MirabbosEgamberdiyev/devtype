  export class FunctionsEmitter4 {
    #subscribers = new Map();
    #bufferedEvents = [];
    #maxBatchSize = 100;

    subscribe(eventType, callback) {
      if (typeof callback !== "function") {
        throw new TypeError(
          "Subscriber listener must be an executable function"
        );
      }
      if (!this.#subscribers.has(eventType)) {
        this.#subscribers.set(eventType, new Set());
      }
      this.#subscribers.get(eventType).add(callback);
      return () => this.#subscribers.get(eventType)?.delete(callback);
    }

    emit(eventType, payload) {
      const eventObject = {
        type: eventType,
        data: payload,
        timestamp: Date.now(),
      };
      this.#bufferedEvents.push(eventObject);
      const listeners = this.#subscribers.get(eventType);
      if (listeners) {
        for (const listener of listeners) {
          try {
            listener(eventObject);
          } catch (err) {
            console.error("Telemetry error:", err);
          }
        }
      }
    }
  }
